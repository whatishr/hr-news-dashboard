name: Daily HR News Collector

on:
  schedule:
    # 매일 한국 시간 오전 8시 실행 (UTC 기준 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 수동으로 실행할 수 있는 버튼 추가

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openai urllib3

      - name: 뉴스 수집 스크립트 실행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python collector.py

      - name: 갱신된 hr_news.csv 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hr_news.csv
          git commit -m "Auto-update: refresh hr_news.csv [skip ci]" || exit 0
          git push