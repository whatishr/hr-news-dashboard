name: Daily HR News Collector & GPT Summarizer

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 모든 히스토리를 불러옵니다.

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests urllib3 openai

      - name: 크롤러 및 GPT 요약 실행
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python collector.py

      - name: 변경된 hr_news.csv 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 커밋하기 전에 최신 main 브랜치 상태로 맞춤
          git fetch origin main
          git reset --soft origin/main
          
          # 2. 파일 추가 및 커밋/푸시
          git add hr_news.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: 매일 HR 뉴스 갱신 [skip ci]" && git push origin main)