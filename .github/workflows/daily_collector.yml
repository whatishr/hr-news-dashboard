name: Daily HR News Collector

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 전체 이력 체크아웃
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 💡 [핵심 1] 커밋 이력을 전체 다 가져와서 rebase/pull이 가능하게 함

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openai urllib3

      - name: 뉴스 수집 스크립트 실행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python collector.py

      - name: 갱신된 hr_news.csv 커밋 및 안전 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 💡 [핵심 2] 최신 최상위 커밋을 먼저 맞춘 뒤 커밋 및 푸시 진행
          git fetch origin main
          git reset --soft origin/main
          
          git add hr_news.csv
          git commit -m "Auto: 매일 HR 뉴스 갱신 [skip ci]" || exit 0
          git push origin main