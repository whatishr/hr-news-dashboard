name: Daily HR News Collector & GPT Summarizer

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests urllib3 openai

      - name: 크롤러 및 GPT 요약 실행
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python collector.py

      # [핵심] 충돌 없는 전용 자동 커밋 모듈 사용
      - name: 변경된 hr_news.csv 자동 커밋 및 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: hr_news.csv via GitHub Actions"
          file_pattern: "hr_news.csv"