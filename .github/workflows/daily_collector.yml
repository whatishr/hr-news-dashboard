name: Daily HR News Collector & GPT Summarizer

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 자동 커밋을 위한 쓰기 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests urllib3 openai

      - name: 크롤러 및 GPT 요약 실행
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python collector.py

      # [핵심] 직접 git push하지 않고 전용 액션에 맡겨 충돌을 완벽 방지합니다.
      - name: 변경된 hr_news.csv 자동 커밋 및 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: 매일 HR 뉴스 갱신 [skip ci]"
          file_pattern: "hr_news.csv"