name: 매일 HR 뉴스 자동 수집

on:
  schedule:
    # 매일 아침 8시 (한국 시간 KST 기준 / UTC 23:00) 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 필요할 때 버튼 눌러 수동 실행 가능 기능

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 필요한 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: 뉴스 수집 실행
      env:
        CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      run: |
        python collector.py

    - name: 수집된 hr_news.csv 데이터 갱신 및 저장
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add hr_news.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: 매일 HR 뉴스 갱신 [skip ci]" && git push)